name: Build release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  extension:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run check:versions
      - run: pnpm exec vp run build
      - run: node scripts/package-release.mjs --extension-only
      - name: Read version
        id: version
        run: node -e 'console.log("version=" + JSON.parse(require("fs").readFileSync("extension/package.json")).version)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension
          if-no-files-found: error
          path: |
            release/helium-synk-extension-${{ steps.version.outputs.version }}.zip
            release/extension-build.json
            release/extension-SHA256SUMS
  relay:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.87.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
          path: release
      - name: Build and test relay with pinned static SQLite
        run: sh scripts/build-release-relay.sh
      - name: Package matching release bundle
        env:
          VERSION: ${{ needs.extension.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          node scripts/package-release.mjs --relay-only
          tar -czf "release/helium-synk-$VERSION-$PLATFORM-$ARCH.tar.gz" -C release \
            "synk-server-$VERSION-$PLATFORM-$ARCH" "helium-synk-extension-$VERSION.zip" \
            build.json SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: release/helium-synk-${{ needs.extension.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
  draft:
    needs: [extension, relay]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.extension.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd artifacts
          tags=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name')
          if grep -Fxq "v$VERSION" <<< "$tags"; then
            echo "Tag v$VERSION already exists; choose a new reviewed version."
            exit 1
          fi
          sha256sum --check extension-SHA256SUMS
          sha256sum "helium-synk-extension-$VERSION.zip" "helium-synk-$VERSION-"*.tar.gz > SHA256SUMS
          gh release create "v$VERSION" --target "$SOURCE_SHA" --draft \
            --title "Helium Synk $VERSION" --generate-notes \
            "helium-synk-extension-$VERSION.zip" "helium-synk-$VERSION-"*.tar.gz \
            extension-build.json SHA256SUMS
          echo "Draft v$VERSION created. Review assets/notes before publishing." >> "$GITHUB_STEP_SUMMARY"
