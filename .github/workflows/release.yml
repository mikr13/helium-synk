name: Build release
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Pin the commit that passed checks
        id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node scripts/sync-rust-version.mjs --check
      - name: Plan the Changesets version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/plan-release.mjs
  checks:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
  extension:
    needs: [plan, checks]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' &&
      (needs.checks.result == 'success' ||
      (github.event_name == 'workflow_run' && needs.checks.result == 'skipped'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run check:versions
      - run: pnpm exec vp run build
      - run: node scripts/package-release.mjs --extension-only
      - name: Read version
        id: version
        run: node -e 'console.log("version=" + JSON.parse(require("fs").readFileSync("extension/package.json")).version)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension
          if-no-files-found: error
          path: |
            release/helium-synk-extension-${{ steps.version.outputs.version }}.zip
            release/extension-build.json
            release/extension-SHA256SUMS
  relay:
    needs: [plan, extension]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.release == 'true' && needs.extension.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.87.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
          path: release
      - name: Build and test relay with pinned static SQLite
        run: sh scripts/build-release-relay.sh
      - name: Package matching release bundle
        env:
          VERSION: ${{ needs.extension.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          node scripts/package-release.mjs --relay-only
          tar -czf "release/helium-synk-$VERSION-$PLATFORM-$ARCH.tar.gz" -C release \
            "synk-server-$VERSION-$PLATFORM-$ARCH" "helium-synk-extension-$VERSION.zip" \
            build.json SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: release/helium-synk-${{ needs.extension.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
  publish:
    needs: [plan, extension, relay]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.extension.result == 'success' && needs.relay.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.extension.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          cd artifacts
          tags=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name')
          if grep -Fxq "v$VERSION" <<< "$tags"; then
            echo "Tag v$VERSION already exists; choose a new reviewed version."
            exit 1
          fi
          sha256sum --check extension-SHA256SUMS
          sha256sum "helium-synk-extension-$VERSION.zip" "helium-synk-$VERSION-"*.tar.gz > SHA256SUMS
          gh release create "v$VERSION" --target "$SOURCE_SHA" \
            --title "Helium Synk $VERSION" --generate-notes \
            "helium-synk-extension-$VERSION.zip" "helium-synk-$VERSION-"*.tar.gz \
            extension-build.json SHA256SUMS
          echo "Published v$VERSION from $SOURCE_SHA with extension, four relay bundles and checksums." >> "$GITHUB_STEP_SUMMARY"
  chrome:
    needs: [plan, publish]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.publish.result == 'success'
    uses: ./.github/workflows/chrome-publish.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      action: submit-review
      publish_type: DEFAULT_PUBLISH
    secrets:
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
